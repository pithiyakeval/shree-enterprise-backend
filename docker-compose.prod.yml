version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: shree-postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shree_user"]
      interval: 5s
      retries: 5

  backend:
    image: shree-backend:prod
    container_name: shree-backend
    restart: always
    env_file:
      - .env.prod
    volumes:
      - ./ai-models:/ai-models
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1

  nginx:
    image: nginx:latest
    container_name: shree-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
